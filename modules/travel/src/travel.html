<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planner</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<!--
  The page and every piece of markup the script clones. The script fills a clone by hooks only:
    [data-slot=name]   set its textContent (or hide it when there is no value)
    [data-icon=name]   replace its content with host.ui.icon(name)
  and toggles the state classes and data attributes listed in CONTRACT.md. It never builds markup with
  strings and never sets a style. The reference rendering is design/itinerary.html.
-->
<div id="app" class="app" hidden>
  <header id="trip" class="trip">
    <div>
      <h1 class="trip-title" data-slot="title"></h1>
      <p class="phase-line" data-slot="phase" hidden></p>
      <div class="trip-meta">
        <div class="trip-when" data-slot="dates"></div>
        <span class="trip-sep" hidden>|</span>
        <div class="trip-facts" data-slot="summary"></div>
      </div>
    </div>
    <!-- icons with tooltips: the trip's own actions. The four views live in the toolbar (see syncHeader). -->
    <div class="tools" role="toolbar" aria-label="Trip">
      <div class="actions" role="group" aria-label="Plan">
        <button class="sdk-icon-btn btn-small" type="button" data-action="toggle-empty" title="Hide empty days" aria-label="Hide empty days" aria-pressed="false"><span class="ic" data-icon="eye-slash"></span></button>
        <button class="sdk-icon-btn btn-small" type="button" data-action="edit-trip" title="Edit dates" aria-label="Edit dates" hidden><span class="ic" data-icon="pen"></span></button>
      </div>
    </div>
  </header>
  <p class="error" id="note" hidden></p>
  <div id="stripbar" class="stripbar">
    <button class="strip-arrow" type="button" data-action="strip-prev" title="Earlier days" aria-label="Earlier days"><span class="ic" data-icon="chevron-left"></span></button>
    <nav id="daystrip" class="daystrip" aria-label="Jump to a day"></nav>
    <button class="strip-arrow" type="button" data-action="strip-next" title="Later days" aria-label="Later days"><span class="ic" data-icon="chevron-right"></span></button>
  </div>
  <main id="body" class="body"></main>

  <!-- the editor: the SDK's editor window (host.ui.editor), a modal dialog over everything. The script puts a clone of
       tpl-editor2 (an item) or tpl-editor-trip (the trip) in it on each open -->
  <dialog id="editor" class="sdk-editor"></dialog>

  <!-- the day dialog: "Move all to..." and the "Clear this day" question for one day (host.ui.editor, medium). The script puts a clone of
       tpl-day-dialog in it on each open. -->
  <dialog id="day-dialog" class="sdk-editor"></dialog>

  <!-- the item menu: a popover the script positions under the button that opened it -->
  <div id="item-menu" class="menu" role="menu" hidden>
    <button type="button" role="menuitem" data-action="edit"><span class="ic" data-icon="pen"></span> Edit</button>
    <button type="button" role="menuitem" data-action="earlier"><span class="ic" data-icon="arrow-up"></span> <span data-slot="earlier-label">Move up</span></button>
    <button type="button" role="menuitem" data-action="later"><span class="ic" data-icon="arrow-down"></span> <span data-slot="later-label">Move down</span></button>
    <!-- opens the grouped list of days (host.menu.show) under this entry, the last entry of which opens a date field -->
    <button type="button" role="menuitem" data-action="move-to" id="menu-day" aria-haspopup="menu"><span class="ic" data-icon="calendar-days"></span> Move to another day…</button>
    <!-- for a time block only: the marker types of the settings (the script fills the list and hides this for anything else) -->
    <label role="menuitem" data-block-only hidden><span class="ic" data-icon="tag"></span> Change type <select id="menu-type" aria-label="Change type"></select></label>
    <button type="button" role="menuitem" data-action="to-line"><span class="ic" data-icon="lightbulb"></span> Move to unscheduled</button>
    <button type="button" role="menuitem" data-action="follow" hidden><span class="ic" data-icon="bell"></span> <span data-slot="follow-label">Follow its result</span></button>
    <button type="button" role="menuitem" class="danger" data-action="delete"><span class="ic" data-icon="trash"></span> <span data-slot="delete-label">Delete</span></button>
  </div>
  <!-- "Pick a date..." at the end of Move to another day: a date field under the item's button, Move or Enter picks -->
  <form id="date-pop" class="menu date-pop" role="dialog" aria-label="Move to a date" hidden>
    <label>Move to<input id="date-pop-input" type="date" required></label>
    <div class="date-pop-buttons"><button class="btn btn-primary" id="date-pop-go" type="submit">Move</button><button class="btn" id="date-pop-cancel" type="button">Cancel</button></div>
  </form>
</div>
<p id="msg" class="hint msg">Loading...</p>

<!-- ============================ templates ============================ -->

<template id="tpl-daychip"><button class="daychip" type="button" data-action="goto-day"><span data-slot="weekday"></span><b data-slot="day"></b></button></template>

<template id="tpl-day-empty"><li class="day-empty" data-slot="text"></li></template>
<template id="tpl-day-empty-add"><li class="day-empty has-add"><button class="day-empty-add" type="button" data-action="day-menu" aria-haspopup="menu"></button></li></template>
<template id="tpl-owner"><span class="owner"></span></template>
<template id="tpl-conflict"><div class="conflict-bar" role="alert"><span data-slot="text"></span><button class="btn btn-small" type="button" data-action="use-theirs">Use theirs</button><button class="btn btn-small" type="button" data-action="keep-mine">Keep mine</button></div></template>
<template id="tpl-suggestion"><div class="suggestion"><span class="ic" data-icon=""></span><span class="suggestion-main"><b data-slot="title"></b> · <span data-slot="module"></span></span><button class="btn btn-small" type="button" data-action="add-suggestion">Add</button></div></template>

<template id="tpl-decisions">
  <div class="section-title" data-slot="polls-title">Polls to vote on</div><ul class="decisions" data-slot="polls"></ul>
  <div class="section-title" data-slot="tasks-title">Tasks due before the trip</div><ul class="decisions" data-slot="tasks"></ul>
</template>
<template id="tpl-decision"><li class="decision"><span class="ic" data-icon=""></span><div class="decision-main"><div class="decision-title" data-slot="title"></div><div class="decision-sub" data-slot="sub"></div><span class="code" data-slot="code"></span></div><button class="btn btn-small" type="button" data-action="open"></button></li></template>

<template id="tpl-state-loading"><div class="skeleton" aria-busy="true"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></template>
<template id="tpl-state-empty-trip"><div class="state" id="state-empty-trip"><p>Nothing on the plan yet. Add something below.</p><form class="add-row"><button class="btn btn-primary" type="submit">Add plan</button></form></div></template>
<template id="tpl-phase-head"><div class="phase-head" data-phase=""><h2 data-slot="label"></h2></div></template>
<template id="tpl-undated"><section class="undated" id="undated"><h2>Unscheduled</h2></section></template>
<template id="tpl-undated-group"><div class="undated-group"><h3 data-slot="label"></h3><ul class="decisions"></ul></div></template>

<!-- ============================ the card family (see CONTRACT.md, "The card family") ============================
     A day is a header and an ol.timeline of rows. A row is li.row.entry[data-type][data-id][data-kind] holding .when (the time),
     .rail (the line and its dot) and .slot (the card). The way between two stops is li.row.leg-row. The type on the row picks the
     colour family; the card's own template picks the silhouette. The script puts the badge's icon in .badge [data-icon] from the
     type (CONTRACT.md has the table). -->
<!-- the day for the card family: the script puts a tpl-day-head clone first, then rows into ol.timeline. Same suggestions and add row as before. -->
<template id="tpl-day2"><section class="day2"><ol class="timeline"></ol><div class="suggestions" hidden><div class="suggestions-title">Other <span data-word="module" data-word-form="many"></span> have</div><div class="suggestions-list"></div></div><form class="add-row"><button class="btn btn-primary" type="submit" data-action="add-item">Add plan</button></form></section></template>
<template id="tpl-day-head"><header class="day-head2"><div class="dnum"><b data-slot="daynum"></b><span data-slot="daymonth"></span></div><div class="dmeta"><h2 data-slot="position"></h2><p data-slot="summary"></p><div class="day-tags" hidden></div></div><div class="day-actions"><button class="btn btn-small day-add" type="button" data-action="day-menu" aria-haspopup="menu" aria-label="Add to this day" title="Add to this day"><span class="ic" data-icon="plus"></span> Add</button><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="day-more" aria-haspopup="menu" aria-label="More for this day" title="More for this day"><span class="ic" data-icon="ellipsis-vertical"></span></button></div></header></template>
<!-- an automatic marker: the first phase's start and the end of the phase before the main one (planning-start, planning-end),
     and the first and last booked object (trip-start, trip-end). With no phases, the planning markers stay on the first and last day.
     Not an item: it has no id, cannot be edited, dragged or removed, and has no menu. The script sets data-marker and fills the slots. -->
<!-- DRAFT (waiting for the author on the type list): a time block, something that happens in a day and has no place: free time, rest, a buffer,
     a meet-up, a leave-by. An item a person adds (li.row.entry, data-kind="block", data-type=free-time|rest|buffer|meet-up|leave-by), drawn as a thin
     coloured band, not a card. The script fills the slots and sets data-type on the article. -->
<!-- A marker type is a label, an icon and one colour (Module Configuration > Planner > Markers): the colour gives the border, the icon
     cell and the label cell. A time block (something that happens in a day and has no place: free time, rest, a buffer, a meet-up, a leave-by)
     is an item a person adds (li.row.entry, data-kind="block") drawn as the same two-part pill. The script sets data-type on the article and,
     for a type whose colour was chosen in the settings, the custom property --marker. -->
<template id="tpl-card-block"><article class="card block markerpill"><span class="mk-icon"><span class="ic" data-icon=""></span></span><span class="mk-label"><b data-slot="title"></b><span class="mk-len" data-slot="minutes"></span><span class="mk-note" data-slot="body"></span></span><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>
<!-- a marker with no time marks the whole day: a tag in the day header (its own colour and icon); clicking it opens the item menu -->
<template id="tpl-day-tag"><button class="daytag" type="button" data-action="move-menu" aria-haspopup="menu"><span class="ic" data-icon=""></span><span data-slot="title"></span></button></template>
<!-- what a card's face has no place for (the note, who, the booking reference...), folded under it -->
<!-- A leg of a round trip: the mark under its card, with the other leg's day ("Round trip · Return Fri, Oct 9"), and a warning when the return is placed before its outbound -->
<template id="tpl-card-roundtrip"><div class="card-roundtrip"><span class="ic" data-icon="right-left"></span><span data-slot="roundtrip-text"></span><span class="roundtrip-warn" data-slot="roundtrip-warn"></span></div></template>
<template id="tpl-card-more"><details class="card-more"><summary><span class="more-open">More</span><span class="more-close">Less</span></summary><dl></dl></details></template>
<template id="tpl-row-marker"><li class="row marker"><div class="when"><b data-slot="time"></b></div><div class="rail"><span class="dot"></span></div><div class="slot"><div class="markercard markerpill"><span class="mk-icon"><span class="ic" data-icon=""></span></span><span class="mk-label"><span class="mk-date" data-slot="mdate"></span><b data-slot="title"></b><span class="sub" data-slot="sub"></span></span></div></div></li></template>
<!-- A marker between the days (the author's: some markers do not belong to a day). An item a person adds, of kind "lane", that follows a day (data-after is
     that day's date; none means before the first day). It sits on the plan's line between the day blocks, in ol.timeline.between[data-after], drawn as the same
     two-part pill with a menu. The script sets data-type, --marker, the icon and the title, as for a time block. -->
<template id="tpl-row-lane"><li class="row entry marker lane" data-kind="lane"><div class="when"><b data-slot="time"></b></div><div class="rail"><span class="dot"></span></div><div class="slot"><div class="markerpill"><span class="mk-icon"><span class="ic" data-icon=""></span></span><span class="mk-label"><b data-slot="title"></b><span class="mk-note" data-slot="body"></span></span><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></div></div></li></template>
<!-- The joint between two days (and after the last, and before the first): a + on the line, quiet until pointed at, that opens host.menu.show to add a marker there. -->
<template id="tpl-joint"><div class="joint"><button class="jointadd" type="button" data-action="gap-add" aria-haspopup="menu" aria-label="Add a marker here" title="Add a marker here"><span class="ic" data-icon="plus"></span></button></div></template>
<!-- Where empty days are hidden: one badge for the run of hidden days, on the line that joins the boxes. The circle is how many days; the + opens
     the same menu (what can be added there, a marker for instance, and "Show these days"). data-from and data-to are the first and last hidden day. -->
<template id="tpl-gap"><div class="gap"><span class="gapcount" data-slot="count"></span><button class="gapadd" type="button" data-action="gap-add" aria-haspopup="menu" aria-label="Add something between these days"><span class="ic" data-icon="plus"></span></button></div></template>
<!-- adding days at either end of the plan (data-edge is before or after); the script opens the form, and the plan's start or end date moves -->
<template id="tpl-dayedge"><div class="dayedge"><button class="btn" type="button" data-action="edge-open"><span class="ic" data-icon="plus"></span> <span data-slot="label"></span></button><form class="edge-form" hidden><label>Add <input type="number" name="count" min="1" max="30" value="1" inputmode="numeric" aria-label="How many days"> <span data-slot="unit">days</span></label><button class="btn btn-primary" type="submit">Add</button><button class="btn" type="button" data-action="edge-cancel">Cancel</button></form></div></template>
<!-- shown where empty days are hidden: says how many, and shows them again -->
<template id="tpl-row"><li class="row entry"><div class="when"><b data-slot="time"></b><small data-slot="sub"></small></div><div class="rail"><span class="dot"></span></div><div class="slot"></div></li></template>
<template id="tpl-leg-row"><li class="row leg-row"><div class="when"></div><div class="rail"></div><div class="slot"><button class="leg" type="button" data-action="edit-leg"><span class="ic" data-icon=""></span><span data-slot="minutes"></span><span class="dist" data-slot="dist"></span></button></div></li></template>

<template id="tpl-card-flight"><article class="card pass"><div class="pass-main"><div class="pass-top"><span class="badge"><span class="ic" data-icon="plane"></span></span><div class="who"><span class="kicker">Flight</span><h3 data-slot="title"></h3></div></div><div class="pass-route"><div class="end"><span class="side">Departs</span><b class="iata" data-slot="fromCode"></b><span class="city" data-slot="from"></span><span class="t" data-slot="time"></span></div><div class="path"><span class="line"></span><span class="ic" data-icon="plane"></span><span class="dur" data-slot="duration"></span></div><div class="end to"><span class="side">Arrives</span><b class="iata" data-slot="toCode"></b><span class="city" data-slot="to"></span><span class="t" data-slot="arrival"></span></div></div></div><div class="stub"><div data-slot="seat-wrap"><small>Seat</small><b data-slot="seat"></b></div><div data-slot="gate-wrap"><small>Gate</small><b data-slot="gate"></b></div><div data-slot="class-wrap"><small>Class</small><b data-slot="travelClass"></b></div><span class="bars"></span></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<template id="tpl-card-train"><article class="card ticket"><header class="strip"><span class="badge"><span class="ic" data-icon="train"></span></span><div class="who"><span class="kicker">Train</span><h3 data-slot="title"></h3></div><span class="pill" data-slot="platform"></span></header><div class="stations"><div class="st"><span class="side">Departs</span><span class="t" data-slot="time"></span><b data-slot="from"></b></div><div class="track"><span class="ic" data-icon="train"></span></div><div class="st to"><span class="side">Arrives</span><span class="t" data-slot="arrival"></span><b data-slot="to"></b></div></div><div class="foot"><span class="pill" data-slot="seat"></span><span class="pill" data-slot="duration"></span><span class="pill mono" data-slot="confirm"></span></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<!-- a bus, a ferry or a car (data-type on the row says which) -->
<template id="tpl-card-transit"><article class="card transit"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><div class="go"><span class="tm" data-slot="time"></span><span class="ic" data-icon="arrow-right"></span><span data-slot="to"></span><span class="pill mono" data-slot="confirm"></span></div></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<template id="tpl-card-hotel"><article class="card stay"><div class="band"><span class="badge"><span class="ic" data-icon="bed"></span></span><div class="main"><span class="kicker" data-slot="kicker">Hotel</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><span class="nights" data-slot="nights"></span></div><div class="ins"><div><small>Check in</small><b data-slot="checkin"></b></div><span class="sep"></span><div><small>Check out</small><b data-slot="checkout"></b></div></div><div class="foot chips2"><span class="pill" data-slot="roomType"></span><span class="pill" data-slot="guests"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>
<!-- the last morning of a stay: check out (picked by span 'end') -->
<template id="tpl-card-hotel-out"><article class="card stay out"><span class="badge"><span class="ic" data-icon="door-open"></span></span><div class="main"><span class="kicker">Check out</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><div class="side"><b data-slot="time"></b><small data-slot="nights"></small></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>
<template id="tpl-card-hotel-mid"><article class="card stay mid"><span class="badge"><span class="ic" data-icon="bed"></span></span><h3 data-slot="title"></h3><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<!-- a meal, a coffee or a drink -->
<template id="tpl-card-meal"><article class="card meal"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="partySize"></span><span class="pill" data-slot="reservationName"></span><span class="owners" data-slot="owners"></span></div></div><div class="side"><b data-slot="time"></b><small data-slot="minutes"></small></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<!-- a sight, a museum, an attraction or a tour -->
<template id="tpl-card-activity"><article class="card act"><span class="badge"><span class="ic" data-icon=""></span></span><div class="main"><span class="kicker" data-slot="kicker"></span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="minutes"></span><span class="pill" data-slot="admissionCount"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<!-- a show or an event with tickets -->
<template id="tpl-card-show"><article class="card admit"><div class="admit-body"><span class="badge"><span class="ic" data-icon="masks-theater"></span></span><div><span class="kicker" data-slot="kicker">Show</span><h3 data-slot="title"></h3><p data-slot="address"></p><div class="chips2"><span class="pill" data-slot="gate"></span><span class="pill mono" data-slot="confirm"></span><span class="owners" data-slot="owners"></span></div></div></div><div class="stub"><small>Admit</small><b data-slot="admissionCount"></b><small data-slot="time"></small></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<template id="tpl-card-note"><article class="card note"><span class="kicker">Note</span><h3 data-slot="title"></h3><div class="note-body" data-slot="body"></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>
<template id="tpl-card-place"><article class="card placecard"><span class="badge"><span class="ic" data-icon="location-dot"></span></span><div class="main"><span class="kicker">Saved place</span><h3 data-slot="title"></h3><p data-slot="address"></p></div><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>
<template id="tpl-card-link"><article class="card linkcard"><div class="src"><span class="ic" data-icon=""></span> <span>from <span data-slot="module"></span></span><button class="open-link" type="button" data-action="open" title="Open it where it lives" aria-label="Open it where it lives"><span class="ic" data-icon="arrow-up-right-from-square"></span></button></div><h3 data-slot="title"></h3><p data-slot="sub"></p><p class="linkstate" data-slot="state" hidden></p><button class="btn" type="button" data-action="remove-link" hidden><span class="ic" data-icon="trash"></span> Remove from plan</button><button class="menu-btn sdk-icon-btn btn-quiet btn-small" type="button" data-action="move-menu" aria-label="Menu"><span class="ic" data-icon="ellipsis-vertical"></span></button></article></template>

<!-- the item editor for the card family (CONTRACT.md, "The editor"): the script replaces #form's contents with a clone of this
     when it opens the dialog and shows the fields whose data-types include the chosen type (adds .on-type). -->
<template id="tpl-editor-trip"><form class="sdk-form" id="form">
    <h3 id="editor-title">The dates</h3>
    <!-- only for a space without phases: with phases the dates are the space's timeline, set from the phase chip in the top bar.
         The plan's name, Where and Notes are no longer asked (stored ones are kept); the budget's currency in Set up wins over Currency. -->
    <div class="sdk-row">
      <div class="sdk-field sdk-m" role="group" aria-labelledby="f-start-label"><span class="sdk-label" id="f-start-label">First day</span><input id="f-start" name="start" type="date" aria-labelledby="f-start-label"><span class="sdk-hint"></span></div>
      <div class="sdk-field sdk-m" role="group" aria-labelledby="f-end-label"><span class="sdk-label" id="f-end-label">Last day</span><input id="f-end" name="end" type="date" aria-labelledby="f-end-label"><span class="sdk-hint"></span></div>
      <label class="sdk-field sdk-m"><span class="sdk-label">Currency</span><select id="f-currency" name="currency"></select><span class="sdk-hint">A currency set on the budget in Set up is used instead.</span></label>
    </div>
    <p class="sdk-hint" id="f-by"></p>
    <p class="sdk-form-error" id="f-error" role="alert" hidden></p>
    <div class="sdk-editor-actions"><button class="btn btn-primary" type="submit" id="f-save">Save</button><button class="btn btn-quiet" type="button" id="f-cancel">Cancel</button></div>
  </form></template>
