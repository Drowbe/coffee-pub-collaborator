<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do</title>
<style>
/*__CSS__*/
</style>
</head>
<body>
<div id="app" class="app" hidden>
  <header class="bar">
    <div class="nav">
      <span class="hint" id="count"></span>
      <span class="show" id="show" role="group" aria-label="Show" hidden></span>
    </div>
    <div class="nav">
      <button class="btn btn-primary" id="add" type="button" hidden>Add task</button>
    </div>
  </header>
  <div id="new-form" class="quick" hidden>
    <button class="btn btn-primary" id="new-todo" type="button">New todo</button>
  </div>
  <div id="spaces" class="spaces" hidden></div>
  <p class="sdk-form-error" id="note" hidden></p>
  <main id="body" class="body"></main>

  <dialog id="editor" class="sdk-editor">
    <form id="form" class="sdk-form">
      <h3 id="editor-title">New task</h3>
      <label class="sdk-field" id="f-where-wrap" hidden><span class="sdk-label">Where</span><select id="f-where"></select><span class="sdk-hint"></span></label>
      <div class="sdk-hint" id="f-readonly" hidden></div>
      <label class="sdk-field"><span class="sdk-label">Task</span><input id="f-title" type="text" maxlength="200" required><span class="sdk-hint"></span></label>
      <label class="sdk-field"><span class="sdk-label">Notes</span><textarea id="f-notes" rows="3" maxlength="1000"></textarea><span class="sdk-hint"></span></label>
      <div class="sdk-form-row">
        <div class="sdk-field sdk-m" role="group" aria-labelledby="f-due-label"><span class="sdk-label" id="f-due-label">Due</span><input id="f-due" type="date" aria-labelledby="f-due-label"><span class="sdk-hint"></span></div>
      </div>
      <div class="sdk-checks" id="f-remind-wrap"><label class="sdk-check"><input id="f-remind" type="checkbox"><span>Remind people at 9:00 that day</span></label></div>
      <div class="sdk-field" id="f-links-wrap" role="group" aria-labelledby="f-links-label">
        <span class="sdk-label" id="f-links-label">Linked</span>
        <div id="f-links" class="links"></div>
        <input id="f-link-search" type="text" maxlength="100" placeholder="Link an event or poll: type to search" aria-label="Search events and polls to link">
        <div id="f-link-results" class="results"></div>
      </div>
      <div id="f-rules"></div>
      <div class="sdk-checks"><label class="sdk-check"><input id="f-done" type="checkbox"><span>Done</span></label></div>
      <div class="sdk-hint" id="f-by"></div>
      <div class="sdk-form-error" id="f-error" role="alert" hidden></div>
      <div class="sdk-editor-actions">
        <button class="btn btn-danger" type="button" id="f-delete" hidden>Delete</button>
        <button class="btn btn-quiet" type="button" id="f-cancel">Cancel</button>
        <button class="btn btn-primary" type="button" id="f-save">Save</button>
      </div>
    </form>
  </dialog>
</div>
<p id="msg" class="hint msg">Loading...</p>
<script>
/*__JS__*/
</script>
</body>
</html>
