<!DOCTYPE html>
<html lang="en" data-theme-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Design system: proposed</title>
  <!-- The proposed design system (documentation/plans/plan-design-system.md): only what Thomas has decided, one family at a time,
       with the families still to decide named and nothing more. It does not load the inventory of what exists today (index.html);
       it reads style.css and theme.css for the frames, and proposed.css for the proposed rules. Served as a static file
       (/design-system/proposed.html); tools/design-system-snapshot.mjs (PAGE=proposed) turns it into a self-contained folder. -->
  <link rel="stylesheet" href="/fa/css/all.min.css" data-ds="fa">
  <link rel="stylesheet" href="/style.css" data-ds="app">
  <link rel="stylesheet" href="/theme.css" data-ds="theme">
  <link rel="stylesheet" href="ds.css">
  <link rel="stylesheet" href="proposed.css" data-ds="proposed">
</head>
<body>
  <a class="ds-skip" href="#ds-main">Skip to the content</a>
  <header class="ds-top" role="banner">
    <button type="button" class="btn ds-menu-btn" id="ds-menu-btn" aria-controls="ds-nav" aria-expanded="false"><i class="fa-solid fa-bars" aria-hidden="true"></i><span class="ds-menu-word"> Sections</span></button>
    <h1 class="ds-title">Design system <span class="ds-sub">proposed</span></h1>
    <label class="ds-search"><span class="visually-hidden">Search families</span>
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="ds-search" placeholder="Search families" autocomplete="off">
    </label>
    <div class="ds-tools" role="group" aria-label="Page tools">
      <a class="btn btn-small" href="index.html" id="ds-other">Today's inventory</a>
      <div class="tb-tabs" role="group" aria-label="Light or dark" id="ds-mode">
        <button type="button" class="tb-tab on" data-mode="dark" aria-pressed="true"><span class="tb-tab-glyph"><i class="fa-solid fa-moon" aria-hidden="true"></i></span><span class="tb-tab-word">Dark</span></button>
        <button type="button" class="tb-tab" data-mode="light" aria-pressed="false"><span class="tb-tab-glyph"><i class="fa-solid fa-sun" aria-hidden="true"></i></span><span class="tb-tab-word">Light</span></button>
      </div>
      <div class="tb-tabs" role="group" aria-label="Font of the examples" id="ds-font">
        <button type="button" class="tb-tab on" data-font="" aria-pressed="true"><span class="tb-tab-word">Today</span></button>
        <button type="button" class="tb-tab" data-font="figtree" aria-pressed="false"><span class="tb-tab-word">Figtree</span></button>
        <button type="button" class="tb-tab" data-font="nunito-sans" aria-pressed="false"><span class="tb-tab-word">Nunito Sans</span></button>
        <button type="button" class="tb-tab" data-font="source-sans-3" aria-pressed="false"><span class="tb-tab-word">Source Sans 3</span></button>
      </div>
      <div class="tb-tabs" role="group" aria-label="Width of the examples" id="ds-width">
        <button type="button" class="tb-tab on" data-w="fit" aria-pressed="true"><span class="tb-tab-word">Fit</span></button>
        <button type="button" class="tb-tab" data-w="390" aria-pressed="false"><span class="tb-tab-word">390</span></button>
        <button type="button" class="tb-tab" data-w="700" aria-pressed="false"><span class="tb-tab-word">700</span></button>
        <button type="button" class="tb-tab" data-w="1280" aria-pressed="false"><span class="tb-tab-word">1280</span></button>
      </div>
    </div>
  </header>
  <div class="ds-shell">
    <nav class="ds-nav" id="ds-nav" aria-label="Sections, proposed"></nav>
    <main class="ds-main" id="ds-main" tabindex="-1">
      <noscript>This page needs JavaScript: its examples are drawn in frames.</noscript>
      <div id="ds-status" class="ds-status" role="status">Drawing the examples</div>
      <div id="ds-content"></div>
    </main>
  </div>
  <script src="proposed.js"></script>
</body>
</html>
