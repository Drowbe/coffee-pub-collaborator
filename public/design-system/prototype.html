  <title>Design system: prototype</title>
  <!-- Prototype: the panel we are building (Thomas, 2026-10-22), the one module panel drawn by createModuleFrame
       (public/module-frame.js) with the moduleframe block of public/sdk/system.css, in four states. What a tweak here changes is
       staged on Proposed. Not a route: the app serves this folder as it is. The themes are themes/<id>.css, written by
       tools/design-system-themes.mjs.
       Address: /design-system/prototype.html?theme=<strong-coffee|calming-teal|burnt-orange>&mode=<dark|light>&w=<390|500|700|1280>&look=<current|proposed> -->
  <link rel="stylesheet" href="../fa/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../sdk/system.css">
  <link rel="stylesheet" href="themes/strong-coffee.css" id="pp-theme-css">
  <link rel="stylesheet" href="prototype.css">
  <link rel="stylesheet" href="pages.css">
</head>
<body class="pp-page">
  <nav class="ds-pages" aria-label="Design system pages"><a href="index.html">Design System</a><a href="proposed.html">Proposed</a><a href="prototype.html" aria-current="page">Prototype</a><a href="legacy/index.html">Legacy</a></nav>
  <header class="pp-top">
    <h1 class="pp-title">Prototype <span class="pp-sub">the panel we are building, in four states</span></h1>
    <div class="pp-tools">
      <div class="mf-switch" role="radiogroup" aria-label="Theme" id="pp-theme"></div>
      <div class="mf-switch" role="radiogroup" aria-label="Light or dark" id="pp-mode"></div>
      <div class="mf-switch" role="radiogroup" aria-label="Panel width" id="pp-width"></div>
      <div class="mf-switch" role="radiogroup" aria-label="Light mode of Strong Coffee" id="pp-look"></div>
    </div>

  </main>
  <script src="sources.js"></script>
  <script src="/sdk/host.js" data-host-sdk></script>
  <script type="module" src="prototype.js"></script>
</body>
</html>
