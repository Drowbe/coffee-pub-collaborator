<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1410">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; img-src 'self' data: blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self'">
  <link rel="icon" href="/img/site/icon">
  <title data-fill>{Module}</title>
  <link rel="stylesheet" href="/fa/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme-head.js"></script>
  <link rel="stylesheet" href="/theme.css" id="theme-link">
  <link rel="stylesheet" href="/sdk/system.css">
</head>
<body class="module-page">
  <header class="topbar"></header>

  <!-- A module's own page, or the module popped out into a window of its own: the module frame (public/module-frame.js,
       drawn by module.js) fills everything under the header: its title bar, toolbar row, the module (it runs in a sandboxed
       frame, module-host.js, or in the page) and its status bar. -->
  <main class="module-canvas" id="module-main">
    <iframe class="module-holder" id="module-frame" title="{Module}" data-fill hidden></iframe>
    <p class="hint module-missing" id="module-missing" data-fill hidden>That {module} is not available.</p>
  </main>

  <script src="/sdk/host.js" data-host-sdk></script>
  <script type="module" src="/module.js"></script>
</body>
</html>
