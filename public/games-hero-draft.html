<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <!-- DRAFT, temporary (plan-product-pages.md, step 7): the games hero art for Thomas to look at, next to the travel art. Not a use
       page and not linked from anywhere. Delete this file when public/games.html is built (step 9); the art then moves into that
       page inline, as the travel art is in travel.html. Colours: only landing.css's --l-* variables and its h-* classes. -->
  <title>Draft: games hero art</title>
  <link rel="stylesheet" href="/landing.css">
  <style>
    .draft { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
    .draft-flag { display: inline-block; padding: 4px 12px; border-radius: var(--radius-round); background: var(--l-coral-soft); color: var(--l-coral-text); font-weight: 600; font-size: 14px; }
    .draft h1 { margin-top: 12px; font-family: "Fraunces", "Fraunces Fallback", Georgia, serif; font-size: 34px; }
    .draft > p { margin-top: 8px; color: var(--l-dim); max-width: 720px; }
    .draft h2 { margin-top: 40px; font-size: 24px; }
    .pair { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 16px; align-items: flex-start; }
    .pair figure { margin: 0; flex: 0 1 auto; min-width: 0; max-width: 100%; }
    .pair figcaption { margin-top: 12px; color: var(--l-dim); font-size: 15px; }
    .pair figcaption b { color: var(--l-text); }
    .w1280 .hero-art { width: 472px; max-width: 100%; }
    .w390 .hero-art { width: 350px; max-width: 100%; }

    /* The games art: new shapes, in landing.css's palette. Gold (the d20, a token, the pencil) reuses .h-sun; the call tile and the
       Sessions card reuse travel's h-* classes as they are. */
    .g-table { fill: var(--l-sand); }
    .g-mat { fill: var(--l-teal-soft); }
    .g-grid { stroke: var(--l-surface); stroke-width: 1.5; opacity: 0.6; fill: none; }
    .g-floor { fill: var(--l-surface); opacity: 0.55; }
    .g-wall { fill: none; stroke: var(--l-ink); stroke-width: 2.5; stroke-linecap: square; stroke-linejoin: miter; }
    .g-threat { fill: var(--l-coral); opacity: 0.16; }
    .g-ring { fill: none; stroke: var(--l-coral); stroke-width: 3; }
    .g-ring2 { fill: none; stroke: var(--l-coral); stroke-width: 1.5; stroke-dasharray: 4 6; }
    .g-foe { fill: var(--l-night); }
    .g-foe-mark { fill: none; stroke: var(--l-coral); stroke-width: 2.5; stroke-linejoin: miter; }
    .g-move { fill: none; stroke: var(--l-ink); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 0.1 8; }
    .g-to { fill: none; stroke: var(--l-ink); stroke-width: 2.5; }
    .g-base { stroke: var(--l-night); stroke-width: 2.5; }
    .g-teal { fill: var(--l-teal); } .g-night { fill: var(--l-night); } .g-coral { fill: var(--l-coral); }
    .g-bone { fill: var(--l-on-night); }
    .g-rim { fill: none; stroke: var(--l-night); stroke-width: 2.5; opacity: 0.5; } .g-rim-l { fill: none; stroke: var(--l-surface); stroke-width: 2.5; opacity: 0.7; }
    .g-line { stroke: var(--l-night); stroke-width: 2.5; stroke-linejoin: round; }
    .g-shade { fill: var(--l-night); }
    .g-edge { fill: none; stroke: var(--l-night); stroke-width: 2.5; stroke-linejoin: round; }
    .g-num { fill: var(--l-night); font: 700 15px "Figtree", "Figtree Fallback", system-ui, sans-serif; }
    .g-sheet { fill: var(--l-surface); stroke: var(--l-line); stroke-width: 2; }
    .g-sheet-head { fill: var(--l-night); }
    .g-box { fill: none; stroke: var(--l-line); stroke-width: 2; }
    .g-rule { fill: var(--l-line); }
    .g-wood { fill: var(--l-sand); }
    .g-cell { fill: var(--l-line); } .g-cell-on { fill: var(--l-coral); }
  </style>
</head>
