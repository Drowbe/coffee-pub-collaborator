<!DOCTYPE html>
<html lang="en" data-theme-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Design system: the panel</title>
  <!-- The panel (Thomas, 2026-10-22): the one module panel, drawn by createModuleFrame (public/module-frame.js) with the
       moduleframe block of public/sdk/system.css, in four states. Not a route: the app serves this folder as it is.
       Address: /design-system/panel.html?theme=<strong-coffee|calming-teal|burnt-orange>&mode=<dark|light>&w=<390|500|700|1280> -->
  <link rel="stylesheet" href="../fa/css/all.min.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../sdk/system.css">
  <link rel="stylesheet" href="prototype/themes/strong-coffee.css" id="pp-theme-css">
  <link rel="stylesheet" href="panel.css">
</head>
<body class="pp-page">
  <header class="pp-top">
    <h1 class="pp-title">The panel</h1>
    <div class="pp-tools">
      <div class="mf-switch" role="group" aria-label="Theme" id="pp-theme"></div>
      <div class="mf-switch" role="group" aria-label="Light or dark" id="pp-mode"></div>
      <div class="mf-switch" role="group" aria-label="Panel width" id="pp-width"></div>
    </div>
  </header>
  <main class="pp-main" id="pp-main">
    <noscript>This page needs JavaScript: the panels are drawn by the product's own code.</noscript>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
