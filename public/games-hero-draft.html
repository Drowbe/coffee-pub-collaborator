<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <!-- DRAFT, temporary (plan-product-pages.md, step 7): the games hero art for Thomas to look at, next to the travel art. Not a use
       page and not linked from anywhere. Delete this file when public/games.html is built (step 9); the art then moves into that
       page inline, as the travel art is in travel.html. Colours: only landing.css's --l-* variables and its h-* classes. -->
  <title>Draft: games hero art</title>
  <link rel="stylesheet" href="/landing.css">
  <style>
    .draft { max-width: 1120px; margin: 0 auto; padding: 24px 20px 64px; }
    .draft-flag { display: inline-block; padding: 4px 12px; border-radius: var(--radius-round); background: var(--l-coral-soft); color: var(--l-coral-text); font-weight: 600; font-size: 14px; }
    .draft h1 { margin-top: 12px; font-family: "Fraunces", "Fraunces Fallback", Georgia, serif; font-size: 34px; }
    .draft > p { margin-top: 8px; color: var(--l-dim); max-width: 720px; }
    .draft h2 { margin-top: 40px; font-size: 24px; }
    .pair { display: flex; flex-wrap: wrap; gap: 32px; margin-top: 16px; align-items: flex-start; }
    .pair figure { margin: 0; flex: 0 1 auto; min-width: 0; max-width: 100%; }
    .pair figcaption { margin-top: 12px; color: var(--l-dim); font-size: 15px; }
    .pair figcaption b { color: var(--l-text); }
    .w1280 .hero-art { width: 472px; max-width: 100%; }
    .w390 .hero-art { width: 350px; max-width: 100%; }

    /* The games art: new shapes, in landing.css's palette. Gold (the d20, a token, the lock) reuses .h-sun; the call tile and the
       card reuse travel's h-* classes as they are. */
    .g-table { fill: var(--l-sand); }
    .g-mat { fill: var(--l-teal-soft); }
    .g-grid { stroke: var(--l-surface); stroke-width: 1.5; opacity: 0.75; fill: none; }
    .g-water { fill: var(--l-sea); }
    .g-tree { fill: var(--l-teal); stroke: var(--l-night); stroke-width: 2.500; stroke-linejoin: round; }
    .g-ink { stroke: var(--l-night); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    .g-line { stroke: var(--l-night); stroke-width: 3; stroke-linejoin: round; }
    .g-face { fill: var(--l-surface); opacity: 0.45; }
    .g-aura { fill: var(--l-coral-soft); }
    .g-smile { fill: none; stroke: var(--l-on-night); stroke-width: 3; stroke-linecap: round; }
    .g-num { fill: var(--l-night); font: 600 18px "Figtree", "Figtree Fallback", system-ui, sans-serif; }
    .g-base { stroke: var(--l-night); stroke-width: 3; }
    .g-coral { fill: var(--l-coral); } .g-teal { fill: var(--l-teal); } .g-night { fill: var(--l-night); }
    .g-in { fill: var(--l-surface); }
    .g-eye, .g-pip, .g-horn { fill: var(--l-on-night); } .g-pupil { fill: var(--l-night); }
    .g-cell { fill: var(--l-line); } .g-cell-on { fill: var(--l-coral); } .g-cell-next { fill: var(--l-teal); }
  </style>
</head>
<body class="landing">
  <!-- The two pictures, drawn once and shown at both sizes. -->
  <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <clipPath id="g-mat-clip"><rect x="52" y="72" width="406" height="316" rx="16"/></clipPath>
      <clipPath id="g-token-clip"><circle cx="0" cy="0" r="15"/></clipPath>
      <path id="g-tree" d="M13 0A6.5 6.5 0 0 1 8.1 10.2A6.5 6.5 0 0 1-2.9 12.7A6.5 6.5 0 0 1-11.7 5.6A6.5 6.5 0 0 1-11.7-5.6A6.5 6.5 0 0 1-2.9-12.7A6.5 6.5 0 0 1 8.1-10.2A6.5 6.5 0 0 1 13 0z"/>
      <clipPath id="map-clip"><rect x="20" y="40" width="470" height="380" rx="30"/></clipPath>
    </defs>

         a chest, trees and a pool, a d20 and a d6, the Sessions calendar card and the same call tile as travel. -->

        <use href="#g-tree" class="g-tree" transform="translate(86 392) scale(1.2)"/>

      </g>
      <g transform="translate(220 240)">

        <g clip-path="url(#g-token-clip)"><circle class="g-teal" cx="0" cy="-3" r="6"/><path class="g-teal" d="M-12 16c1-9 6-12 12-12s11 3 12 12z"/></g>
      </g>
      <g transform="translate(172 288)">
        <circle class="g-coral g-base" r="22"/><circle class="g-in" r="15"/>

      </g>
      <!-- the dice: a d20 where the sun is, a d6 at the table's edge -->
      <g transform="translate(452 90) rotate(8)">
        <path class="h-sun" d="M0-48L41.6-24V24L0 48-41.6 24V-24z"/>
        <path class="g-face" d="M0-26L22.5 13H-22.5z"/>

      </g>
      <!-- the call: the same tile as travel -->
      <g transform="translate(300 292)">
        <rect class="h-night" x="0" y="0" width="226" height="138" rx="22"/>
        <rect class="h-tile" x="14" y="14" width="96" height="84" rx="14"/>
        <circle class="h-face-a" cx="62" cy="46" r="15"/><path class="h-face-a" d="M36 98c2-20 13-28 26-28s24 8 26 28z"/>

      <!-- Sessions: a month with the next game night marked -->
      <g transform="translate(14 8)">
        <rect class="h-sheet" x="0" y="0" width="200" height="126" rx="18"/>
        <path class="h-sheet-top" d="M0 40V18a18 18 0 0 1 18-18h164a18 18 0 0 1 18 18v22z"/>
        <circle class="h-day" cx="30" cy="20" r="11"/>

        <g transform="translate(14 52)">

          <rect class="g-cell" x="0" y="24" width="20" height="18" rx="5"/><rect class="g-cell" x="25" y="24" width="20" height="18" rx="5"/><rect class="g-cell" x="50" y="24" width="20" height="18" rx="5"/><rect class="g-cell" x="75" y="24" width="20" height="18" rx="5"/><rect class="g-cell-next" x="100" y="24" width="20" height="18" rx="5"/><rect class="g-cell" x="125" y="24" width="20" height="18" rx="5"/><rect class="g-cell" x="150" y="24" width="20" height="18" rx="5"/>
          <rect class="g-cell" x="0" y="48" width="20" height="18" rx="5"/><rect class="g-cell" x="25" y="48" width="20" height="18" rx="5"/><rect class="g-cell" x="50" y="48" width="20" height="18" rx="5"/><rect class="g-cell" x="75" y="48" width="20" height="18" rx="5"/><rect class="g-cell-next" x="100" y="48" width="20" height="18" rx="5"/><rect class="g-cell" x="125" y="48" width="20" height="18" rx="5"/><rect class="g-cell" x="150" y="48" width="20" height="18" rx="5"/>
        </g>
      </g>
    </symbol>

    <!-- TRAVEL (today, copied from travel.html for comparison) -->

      <g clip-path="url(#map-clip)">

  <main class="draft">
    <span class="draft-flag">Draft, temporary</span>
    <h1>Games hero art</h1>
    <p>For Thomas to look at before the games page is built. Delete this page when /games is built. Each picture is shown at the width the hero art gets on the page.</p>

    <h2>At 1280 wide</h2>
    <div class="pair w1280">
      <figure><div class="hero-art"><svg viewBox="0 0 560 470" role="img" aria-label="A game table from above: a battle map with three player tokens moving toward a friendly monster, a d20 and a d6, the Sessions calendar and a video call with two players."><use href="#art-games"/></svg></div><figcaption><b>Games</b>, the draft</figcaption></figure>
      <figure><div class="hero-art"><svg viewBox="0 0 560 470" role="img" aria-label="The travel art: a trip route across a map, with a video call and a day plan."><use href="#art-travel"/></svg></div><figcaption><b>Travel</b>, as it is on /travel</figcaption></figure>
    </div>

    <h2>At 390 wide</h2>
    <div class="pair w390">
      <figure><div class="hero-art"><svg viewBox="0 0 560 470" role="img" aria-label="The games art, at phone size."><use href="#art-games"/></svg></div><figcaption><b>Games</b>, the draft</figcaption></figure>
      <figure><div class="hero-art"><svg viewBox="0 0 560 470" role="img" aria-label="The travel art, at phone size."><use href="#art-travel"/></svg></div><figcaption><b>Travel</b>, as it is on /travel</figcaption></figure>
    </div>
  </main>
</body>
</html>
